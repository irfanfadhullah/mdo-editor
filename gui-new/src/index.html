<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: file:; img-src * data: file: blob:; media-src * data: file: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src 'self' https: http: data: blob: file:;">
  <title>MDO Viewer</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/blocks.css">
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <div class="toolbar" id="toolbar">
      <div class="toolbar-group">
        <button class="toolbar-btn" id="btn-new" title="New Document">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        </button>
        <button class="toolbar-btn" id="btn-open" title="Open File">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
      <div class="toolbar-group">
        <button class="toolbar-btn" id="btn-folder" title="Open Folder">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="toolbar-btn disabled" id="btn-extract" title="Extract Archive">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>
      <div class="toolbar-spacer"></div>
      <button class="btn btn-ghost btn-small" id="btn-edit-toggle" title="Toggle Edit Mode">
        <svg viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Edit
      </button>
      <span class="toolbar-path" id="toolbar-path"></span>
    </div>

    <!-- Main panels -->
    <div class="main-panels" id="main-panels">
      <!-- Sidebar: File Explorer -->
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">Explorer</span>
          <button class="toolbar-btn" id="btn-refresh" title="Refresh" style="width:24px;height:24px;">
            <svg viewBox="0 0 24 24" style="width:13px;height:13px;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
        </div>
        <div class="sidebar-tree" id="sidebar-tree"></div>
        <div class="sidebar-empty" id="sidebar-empty">
          <svg viewBox="0 0 24 24" style="width:32px;height:32px;opacity:0.2;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>Open a folder<br>to browse files</span>
        </div>
      </div>

      <!-- Content: Unified Block Editor -->
      <div class="content" id="content-area">
        <!-- Tabs -->
        <div class="tabs-bar" id="tabs-bar"></div>
        <!-- Editor -->
        <div class="block-editor" id="block-editor">
          <div class="block-editor-inner" id="block-editor-inner">
            <div class="preview-empty" id="preview-empty">
              <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              <div>
                <h2>MDO Viewer</h2>
                <p>Open a markdown or .mdo file, or start writing.</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Outline: Document Headlines -->
      <div class="outline" id="outline">
        <div class="outline-header">
          <span class="outline-title">Outline</span>
        </div>
        <div class="outline-list" id="outline-list">
          <div class="outline-empty" id="outline-empty">
            <span>No headings</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Drop overlay -->
    <div class="drop-overlay" id="drop-overlay"></div>
  </div>

  <script src="js/blocks.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
